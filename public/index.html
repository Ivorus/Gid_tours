<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Экскурсии</title>
  <style>
    :root{
      --bg:#0b0c10; --card:#11131a; --border:#24273a;
      --text:#e9ecff; --muted:#a7acc7;
      --accent:#4f6ef7; --accent2:#7c4dff;
      --radius:18px; --logo:40px; --imgH:190px; --btnH:44px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(79,110,247,.22), transparent 60%),
        radial-gradient(900px 500px at 80% 20%, rgba(124,77,255,.18), transparent 55%),
        var(--bg);
      color:var(--text)
    }
    .topbar{
      position:sticky;top:0;z-index:20;
      backdrop-filter: blur(12px);
      background: rgba(11,12,16,.55);
      border-bottom:1px solid rgba(36,39,58,.7);
    }
    .wrap{max-width:1120px;margin:0 auto;padding:16px}
    .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{
      width:var(--logo);height:var(--logo);border-radius:14px;
      background: linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow: 0 10px 30px rgba(79,110,247,.22);
      flex:0 0 auto;
    }
    .title{font-weight:900;letter-spacing:.2px}
    .subtitle{color:var(--muted);font-size:13px;margin-top:2px}
    .search{
      width:min(420px, 100%);
      border:1px solid var(--border);
      background:rgba(17,19,26,.75);
      border-radius:999px;
      padding:10px 14px;
      color:var(--text);
      outline:none;
    }
    .hero{
      margin-top:12px;
      border:1px solid rgba(36,39,58,.7);
      background: linear-gradient(180deg, rgba(17,19,26,.85), rgba(15,16,22,.7));
      border-radius: var(--radius);
      padding:14px;
      display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    }
    .hero b{font-size:18px}
    .hero .muted{color:var(--muted);margin-top:6px}
    .cta{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:0;color:white;
      height:var(--btnH);
      padding:0 14px;border-radius:999px;
      cursor:pointer;font-weight:800;
      box-shadow: 0 12px 30px rgba(79,110,247,.22);
      white-space:nowrap;
    }

    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap:14px;
    }
    .card{
      border:1px solid rgba(36,39,58,.75);
      background: rgba(17,19,26,.75);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
    }
    .media{position:relative;height:var(--imgH);background: rgba(255,255,255,.05)}
    .media img{width:100%;height:100%;object-fit:cover;display:block}
    .badge{
      position:absolute;left:12px;top:12px;
      background:rgba(15,16,22,.75);
      border:1px solid rgba(36,39,58,.75);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;color:var(--muted)
    }
    .content{padding:14px}
    .h{font-weight:900;font-size:16px;line-height:1.2}
    .muted{color:var(--muted)}
    .actions{display:flex;gap:10px;margin-top:12px}
    .btn{
      flex:1;
      height:var(--btnH);
      background:rgba(79,110,247,.16);
      border:1px solid rgba(79,110,247,.35);
      color:var(--text);
      border-radius:12px;
      cursor:pointer;font-weight:800;
    }
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:white}

    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
    .modal{
      width:min(980px, 100%);
      border:1px solid rgba(36,39,58,.75);
      background: rgba(12,13,18,.96);
      border-radius:22px;
      overflow:hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .modalTop{padding:14px 14px 0 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .close{background:rgba(255,255,255,.06);border:1px solid rgba(36,39,58,.75);color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer}
    .modalBody{padding:14px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
    .gallery{border:1px solid rgba(36,39,58,.7);border-radius:18px;overflow:hidden;background: rgba(255,255,255,.04)}
    .galleryMain{height:320px}
    .galleryMain img{width:100%;height:100%;object-fit:cover;display:block}
    .thumbs{display:flex;gap:8px;overflow:auto;padding:10px;border-top:1px solid rgba(36,39,58,.7);background: rgba(15,16,22,.55)}
    .thumb{width:86px;height:56px;border-radius:12px;overflow:hidden;flex:0 0 auto;border:1px solid rgba(36,39,58,.7);cursor:pointer;opacity:.75}
    .thumb.active{opacity:1;border-color:rgba(79,110,247,.7)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .form{border:1px solid rgba(36,39,58,.75);border-radius:18px;padding:12px;background: rgba(17,19,26,.6)}
    label{display:block;margin:10px 0 6px;font-size:13px;color:var(--muted)}
    input,select,textarea{width:100%;padding:10px;border-radius:12px;border:1px solid rgba(36,39,58,.85);background: rgba(15,16,22,.75);color:var(--text);outline:none}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .send{margin-top:12px;width:100%;height:var(--btnH);background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:white;border-radius:12px;cursor:pointer;font-weight:900}
    .note{font-size:12px;color:var(--muted);margin-top:10px}

    /* ✅ Mobile */
    @media (max-width: 900px){
      .modalBody{grid-template-columns:1fr}
      .galleryMain{height:240px}
      .thumb{width:78px;height:52px}
    }
    @media (max-width: 520px){
      .wrap{padding:12px}
      .grid{grid-template-columns:1fr}
      .media{height:200px}
      .actions{flex-direction:column}
      .btn{width:100%}
      .hero b{font-size:16px}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="row">
        <div class="brand">
          <div class="logo"></div>
          <div>
            <div class="title" id="brandName">Guide Israel</div>
            <div class="subtitle" id="subtitle">Экскурсии по Израилю • запись онлайн</div>
          </div>
        </div>
        <input id="search" class="search" placeholder="Поиск: Иерусалим, Мёртвое море..." />
      </div>

      <div class="hero">
        <div>
          <b id="heroTitle">Выберите экскурсию — и запишитесь за 1 минуту</b>
          <div class="muted" id="heroDesc">После заявки мы подтверждаем запись и связываемся с вами.</div>
        </div>
        <button class="cta" id="scrollBtn">Смотреть экскурсии</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="list" class="grid"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modalTop">
        <div>
          <div class="h" id="mTitle"></div>
          <div class="muted" id="mDesc" style="margin-top:6px"></div>
          <div class="muted" id="mMeta" style="margin-top:10px"></div>
        </div>
        <button class="close" id="closeBtn">✕</button>
      </div>

      <div class="modalBody">
        <div class="gallery">
          <div class="galleryMain"><img id="mainImg" alt=""></div>
          <div class="thumbs" id="thumbs"></div>
        </div>

        <div class="form">
          <div class="muted" style="font-weight:700">Заявка на экскурсию</div>

          <label>Имя и фамилия</label>
          <input id="name" placeholder="Например: Василий Иванов"/>

          <label>Телефон (WhatsApp)</label>
          <input id="phone" placeholder="+972..."/>

          <label>Дата и время</label>
          <input id="date" type="datetime-local"/>

          <div class="two">
            <div>
              <label>Кол-во людей</label>
              <input id="people" type="number" min="1" value="1"/>
            </div>
            <div>
              <label>Комментарий</label>
              <input id="comment" placeholder="По желанию"/>
            </div>
          </div>

          <button class="send" id="sendBtn">Отправить заявку</button>
          <div class="note" id="result"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  let TOURS = [];
  let CURRENT = null;

  function setCSSVar(name, val){
    if(val === undefined || val === null || val === "") return;
    document.documentElement.style.setProperty(name, String(val));
  }

  async function loadTheme(){
    const theme = await fetch("/api/theme").then(r=>r.json()).catch(()=> ({}));

    // apply text blocks
    if(theme.brand_name) document.getElementById("brandName").textContent = theme.brand_name;
    if(theme.subtitle) document.getElementById("subtitle").textContent = theme.subtitle;
    if(theme.hero_title) document.getElementById("heroTitle").textContent = theme.hero_title;
    if(theme.hero_desc) document.getElementById("heroDesc").textContent = theme.hero_desc;

    // apply colors/sizes
    setCSSVar("--bg", theme.bg);
    setCSSVar("--card", theme.card);
    setCSSVar("--border", theme.border);
    setCSSVar("--text", theme.text);
    setCSSVar("--muted", theme.muted);
    setCSSVar("--accent", theme.accent);
    setCSSVar("--accent2", theme.accent2);

    if(Number.isFinite(Number(theme.radius))) setCSSVar("--radius", theme.radius + "px");
    if(Number.isFinite(Number(theme.logo_size))) setCSSVar("--logo", theme.logo_size + "px");
    if(Number.isFinite(Number(theme.card_image_h))) setCSSVar("--imgH", theme.card_image_h + "px");
    if(Number.isFinite(Number(theme.btn_h))) setCSSVar("--btnH", theme.btn_h + "px");
  }

  function safeText(s){ return (s || "").toString(); }
  function firstPhoto(t){
    if (Array.isArray(t.photos) && t.photos.length) return t.photos[0];
    if (t.image_url) return t.image_url;
    return "";
  }
  function priceChip(t){
    const p = Number(t.price_ils || 0);
    return p ? `₪${p}` : "₪—";
  }
  function durChip(t){
    const m = Number(t.duration_min || 0);
    if(!m) return "⏱ —";
    const h = Math.round((m/60)*10)/10;
    return m >= 60 ? `⏱ ${h} ч` : `⏱ ${m} мин`;
  }

  function render(list){
    const el = document.getElementById("list");
    if(!list.length){
      el.innerHTML = `<div class="card"><div class="content"><div class="muted">Пока нет экскурсий. Админ добавляет их в /admin</div></div></div>`;
      return;
    }
    el.innerHTML = list.map(t => {
      const cover = firstPhoto(t);
      const title = safeText(t.title_ru);
      const desc = safeText(t.desc_ru);

      return `
        <div class="card">
          <div class="media">
            ${cover ? `<img src="${cover}" alt="">` : `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:rgba(167,172,199,.7)">Нет фото</div>`}
            <div class="badge">${priceChip(t)} • ${durChip(t)}</div>
          </div>
          <div class="content">
            <div class="h">${title || "—"}</div>
            <div class="muted" style="margin-top:8px;line-height:1.35">${desc ? desc.slice(0,140) + (desc.length>140 ? "…" : "") : ""}</div>
            <div class="actions">
              <button class="btn" onclick="openTour('${t.id}')">Подробнее</button>
              <button class="btn primary" onclick="openTour('${t.id}', true)">Записаться</button>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function setMainImage(url){
    const img = document.getElementById("mainImg");
    img.src = url || "";
  }

  function renderThumbs(photos){
    const thumbs = document.getElementById("thumbs");
    if(!Array.isArray(photos) || !photos.length){
      thumbs.innerHTML = `<div class="muted" style="padding:8px 2px">Нет фото</div>`;
      return;
    }
    thumbs.innerHTML = photos.map((p, i)=>`
      <div class="thumb ${i===0?'active':''}" onclick="pickPhoto(${i})">
        <img src="${p}" alt="">
      </div>
    `).join("");
  }

  window.pickPhoto = (idx)=>{
    const photos = (CURRENT && Array.isArray(CURRENT.photos)) ? CURRENT.photos : [];
    const url = photos[idx] || firstPhoto(CURRENT);
    setMainImage(url);
    document.querySelectorAll(".thumb").forEach((t,i)=> t.classList.toggle("active", i===idx));
  }

  window.openTour = (id, focusForm)=>{
    const t = TOURS.find(x => x.id === id);
    if(!t) return;
    CURRENT = t;

    document.getElementById("mTitle").textContent = safeText(t.title_ru);
    document.getElementById("mDesc").textContent  = safeText(t.desc_ru);
    document.getElementById("mMeta").textContent  = `${priceChip(t)} • ${durChip(t)}`;

    const photos = Array.isArray(t.photos) && t.photos.length ? t.photos : (firstPhoto(t) ? [firstPhoto(t)] : []);
    CURRENT.photos = photos;
    setMainImage(photos[0] || "");
    renderThumbs(photos);

    document.getElementById("result").textContent = "";
    document.getElementById("overlay").style.display = "flex";
    if(focusForm) setTimeout(()=>document.getElementById("name").focus(), 30);
  }

  function closeModal(){ document.getElementById("overlay").style.display = "none"; }
  document.getElementById("closeBtn").onclick = closeModal;
  document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id === "overlay") closeModal(); });

  document.getElementById("scrollBtn").onclick = ()=> window.scrollTo({ top: 260, behavior: "smooth" });

  document.getElementById("search").addEventListener("input", ()=>{
    const q = document.getElementById("search").value.trim().toLowerCase();
    if(!q) return render(TOURS);
    const filtered = TOURS.filter(t => (safeText(t.title_ru)+" "+safeText(t.desc_ru)).toLowerCase().includes(q));
    render(filtered);
  });

  document.getElementById("sendBtn").onclick = async ()=>{
    if(!CURRENT) return;

    // ✅ мгновенное сообщение + блок кнопки
    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.style.opacity = "0.7";
    document.getElementById("result").textContent = "Отправляем заявку...";

    const payload = {
      tour_id: CURRENT.id,
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      date_iso: new Date(document.getElementById("date").value).toISOString(),
      people: document.getElementById("people").value,
      comment: document.getElementById("comment").value
    };

    const res = await fetch("/api/bookings", {
      method:"POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(()=> ({}));

    if(!res.ok){
      document.getElementById("result").textContent = "Ошибка: " + (data.error || "unknown");
      btn.disabled = false;
      btn.style.opacity = "1";
      return;
    }

    // ✅ сразу показать успех + закрыть через 2 сек
    document.getElementById("result").textContent = "✅ Заявка отправлена! Номер: " + data.booking.id;
    setTimeout(()=>{ closeModal(); }, 2000);

    btn.disabled = false;
    btn.style.opacity = "1";
  };

  async function load(){
    await loadTheme();
    TOURS = await fetch("/api/tours").then(r=>r.json());
    render(TOURS);
  }
  load();
</script>
</body>
</html>
