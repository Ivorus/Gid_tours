<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Экскурсии</title>
  <style>
    :root{
      --bg:#0b0c10; --card:#11131a; --border:#24273a;
      --text:#e9ecff; --muted:#a7acc7;
      --accent:#4f6ef7; --accent2:#7c4dff;
      --radius:18px; --logo:40px; --imgH:190px; --btnH:44px;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(79,110,247,.20), transparent 60%),
        radial-gradient(900px 500px at 80% 20%, rgba(124,77,255,.16), transparent 55%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    /* ===== Topbar ===== */
    .topbar{
      position:sticky; top:0; z-index:20;
      backdrop-filter:blur(14px);
      background:rgba(11,12,16,.6);
      border-bottom:1px solid rgba(36,39,58,.7);
    }
    .wrap{ max-width:1120px; margin:0 auto; padding:14px 16px; }
    .bar-row{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }

    /* ===== Brand ===== */
    .brand{ display:flex; gap:12px; align-items:center; }
    .logo{
      width:var(--logo); height:var(--logo);
      border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 8px 24px rgba(79,110,247,.26);
      flex:0 0 auto;
    }
    .brand-title{ font-weight:900; letter-spacing:.2px; font-size:16px; }
    .brand-sub{ color:var(--muted); font-size:12px; margin-top:2px; }

    /* ===== Search ===== */
    .search{
      width:min(400px,100%);
      border:1px solid var(--border);
      background:rgba(17,19,26,.8);
      border-radius:999px;
      padding:10px 16px;
      color:var(--text);
      outline:none;
      font-size:15px;
      transition:border-color .2s;
    }
    .search:focus{ border-color:rgba(79,110,247,.6); }

    /* ===== Hero ===== */
    .hero{
      margin-top:12px;
      border:1px solid rgba(36,39,58,.7);
      background:linear-gradient(180deg,rgba(17,19,26,.9),rgba(15,16,22,.7));
      border-radius:var(--radius);
      padding:16px;
      display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .hero-text b{ font-size:17px; display:block; }
    .hero-text .muted{ color:var(--muted); font-size:13px; margin-top:6px; }
    .cta{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:0; color:white;
      height:var(--btnH);
      padding:0 20px;
      border-radius:999px;
      cursor:pointer; font-weight:800; font-size:14px;
      box-shadow:0 10px 28px rgba(79,110,247,.25);
      white-space:nowrap; flex-shrink:0;
    }

    /* ===== Grid ===== */
    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:14px;
    }
    .card{
      border:1px solid rgba(36,39,58,.75);
      background:rgba(17,19,26,.8);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 16px 36px rgba(0,0,0,.2);
    }
    .media{ position:relative; height:var(--imgH); background:rgba(255,255,255,.04); }
    .media img{ width:100%; height:100%; object-fit:cover; display:block; }
    .media-empty{
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      color:rgba(167,172,199,.6); font-size:13px;
    }
    .badge{
      position:absolute; left:12px; top:12px;
      background:rgba(12,12,16,.8);
      border:1px solid rgba(36,39,58,.7);
      border-radius:999px;
      padding:5px 12px;
      font-size:12px; color:var(--muted);
      backdrop-filter:blur(4px);
    }
    .content{ padding:14px; }
    .tour-title{ font-weight:900; font-size:15px; line-height:1.3; }
    .tour-desc{ color:var(--muted); font-size:13px; margin-top:7px; line-height:1.4; }
    .actions{ display:flex; gap:10px; margin-top:14px; }
    .btn{
      flex:1;
      height:var(--btnH);
      background:rgba(79,110,247,.14);
      border:1px solid rgba(79,110,247,.3);
      color:var(--text);
      border-radius:12px;
      cursor:pointer; font-weight:800; font-size:14px;
      transition:background .2s;
    }
    .btn:active{ opacity:.8; }
    .btn.primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:0; color:white;
    }

    /* ===== Modal overlay ===== */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.65);
      display:none; align-items:flex-end; justify-content:center;
      padding:0; z-index:50;
    }
    .modal{
      width:100%; max-width:980px;
      border:1px solid rgba(36,39,58,.75);
      background:rgba(10,11,16,.97);
      border-radius:22px 22px 0 0;
      overflow:hidden;
      box-shadow:0 -20px 60px rgba(0,0,0,.5);
      max-height:92vh;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .modalTop{
      padding:14px 16px 0;
      display:flex; justify-content:space-between; gap:12px; align-items:flex-start;
      position:sticky; top:0; background:rgba(10,11,16,.96); z-index:5;
      border-bottom:1px solid rgba(36,39,58,.5);
      padding-bottom:12px;
    }
    .modal-drag{ width:40px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin:0 auto 10px; }
    .close{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(36,39,58,.7);
      color:var(--text);
      border-radius:10px;
      padding:8px 12px;
      cursor:pointer;
      font-size:18px;
      line-height:1;
      flex-shrink:0;
    }
    .modalBody{ padding:14px; display:grid; grid-template-columns:1.2fr .9fr; gap:14px; }

    /* ===== Gallery ===== */
    .gallery{ border:1px solid rgba(36,39,58,.7); border-radius:16px; overflow:hidden; background:rgba(255,255,255,.03); }
    .galleryMain{ height:300px; }
    .galleryMain img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumbs{ display:flex; gap:8px; overflow-x:auto; padding:10px; border-top:1px solid rgba(36,39,58,.6); background:rgba(15,16,22,.6); }
    .thumbs::-webkit-scrollbar{ height:3px; }
    .thumb{ width:80px; height:52px; border-radius:10px; overflow:hidden; flex:0 0 auto; border:2px solid rgba(36,39,58,.7); cursor:pointer; opacity:.65; transition:opacity .2s, border-color .2s; }
    .thumb.active{ opacity:1; border-color:var(--accent); }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

    /* ===== Booking form ===== */
    .form{ border:1px solid rgba(36,39,58,.75); border-radius:16px; padding:14px; background:rgba(17,19,26,.65); }
    .form-title{ font-weight:800; font-size:16px; margin-bottom:4px; }
    label{ display:block; margin:11px 0 5px; font-size:12px; color:var(--muted); }
    input,select,textarea{
      width:100%; padding:11px 13px;
      border-radius:12px; border:1px solid rgba(36,39,58,.85);
      background:rgba(15,16,22,.8); color:var(--text);
      outline:none; font-size:15px;
      transition:border-color .2s;
    }
    input:focus, select:focus{ border-color:rgba(79,110,247,.6); }
    .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .send{
      margin-top:14px; width:100%; height:var(--btnH);
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:0; color:white; border-radius:12px;
      cursor:pointer; font-weight:900; font-size:16px;
      transition:opacity .2s, transform .1s;
    }
    .send:active{ transform:scale(.98); }
    .send:disabled{ opacity:.6; cursor:not-allowed; }

    /* ===== Success overlay ===== */
    .success-screen{
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      text-align:center;
      min-height:200px;
    }
    .success-screen.visible{ display:flex; }
    .success-icon{
      font-size:64px;
      line-height:1;
      animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes pop{
      from{ transform:scale(0); opacity:0; }
      to{ transform:scale(1); opacity:1; }
    }
    .success-title{ font-size:22px; font-weight:900; margin-top:16px; }
    .success-sub{ color:var(--muted); font-size:14px; margin-top:8px; max-width:280px; }
    .success-id{ font-size:12px; color:var(--muted); margin-top:12px; font-family:monospace; }

    /* ===== Note ===== */
    .note{ font-size:12px; color:var(--muted); margin-top:10px; }

    /* ===== Toast ===== */
    .site-toast{
      position:fixed; bottom:20px; left:50%;
      transform:translateX(-50%) translateY(80px);
      background:#1a2a1a;
      border:1px solid #00e676;
      color:#00e676;
      padding:12px 24px;
      border-radius:999px;
      font-weight:700; font-size:14px;
      z-index:200;
      opacity:0;
      transition:opacity .3s, transform .3s;
      white-space:nowrap;
      pointer-events:none;
    }
    .site-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== Mobile responsive ===== */
    @media (max-width: 900px){
      .modalBody{ grid-template-columns:1fr; }
      .galleryMain{ height:220px; }
      .overlay{ align-items:flex-end; }
      .modal{ border-radius:22px 22px 0 0; max-height:94vh; }
    }
    @media (max-width: 600px){
      .wrap{ padding:12px; }
      .grid{ grid-template-columns:1fr; gap:12px; }
      .media{ height:200px; }
      .actions{ gap:8px; }
      .btn{ height:42px; font-size:13px; }
      .hero-text b{ font-size:15px; }
      .hero{ padding:14px; }
      .search{ width:100%; }
      .bar-row{ gap:10px; }
      .two{ grid-template-columns:1fr; gap:8px; }
      .thumb{ width:70px; height:46px; }
      .galleryMain{ height:200px; }
      .modalBody{ padding:12px; }
      .form{ padding:12px; }
      .modalTop{ padding:10px 12px 10px; }
    }
    @media (max-width: 400px){
      .cta{ padding:0 14px; font-size:13px; }
      .brand-title{ font-size:14px; }
    }
  </style>
</head>
<body>

<!-- Site toast -->
<div class="site-toast" id="siteToast"></div>

<!-- ===== Topbar ===== -->
<div class="topbar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="brand-title" id="brandName">Guide Israel</div>
          <div class="brand-sub" id="subtitle">Экскурсии по Израилю • запись онлайн</div>
        </div>
      </div>
      <input id="search" class="search" placeholder="Поиск: Иерусалим, Тель-Авив..."/>
    </div>

    <div class="hero">
      <div class="hero-text">
        <b id="heroTitle">Выберите экскурсию — и запишитесь за 1 минуту</b>
        <div class="muted" id="heroDesc">После заявки мы подтверждаем запись и связываемся с вами.</div>
      </div>
      <button class="cta" id="scrollBtn">Смотреть экскурсии</button>
    </div>
  </div>
</div>

<!-- ===== Tour list ===== -->
<div class="wrap">
  <div id="list" class="grid"></div>
</div>

<!-- ===== Modal ===== -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-drag"></div>
    <div class="modalTop">
      <div style="flex:1;min-width:0">
        <div class="tour-title" id="mTitle" style="font-size:17px"></div>
        <div class="muted" id="mDesc" style="margin-top:5px;font-size:13px;line-height:1.35"></div>
        <div class="muted" id="mMeta" style="margin-top:8px;font-size:13px"></div>
      </div>
      <button class="close" id="closeBtn">✕</button>
    </div>

    <div class="modalBody">
      <!-- Gallery -->
      <div class="gallery">
        <div class="galleryMain"><img id="mainImg" alt=""></div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <!-- Booking form -->
      <div class="form" id="bookingForm">
        <div class="form-title">Записаться на экскурсию</div>
        <div class="muted" style="font-size:12px;margin-top:4px">Отвечаем в течение часа</div>

        <label>Имя и фамилия *</label>
        <input id="name" placeholder="Например: Анна Иванова" autocomplete="name">

        <label>Телефон / WhatsApp *</label>
        <input id="phone" placeholder="+972..." type="tel" autocomplete="tel">

        <label>Дата и время *</label>
        <input id="date" type="datetime-local">

        <div class="two">
          <div>
            <label>Количество человек</label>
            <input id="people" type="number" min="1" value="1" inputmode="numeric">
          </div>
          <div>
            <label>Комментарий</label>
            <input id="comment" placeholder="Пожелания...">
          </div>
        </div>

        <button class="send" id="sendBtn">Отправить заявку</button>
        <div class="note" id="result"></div>
      </div>

      <!-- Success screen (shown after booking) -->
      <div class="success-screen" id="successScreen">
        <div class="success-icon">✅</div>
        <div class="success-title">Заявка принята!</div>
        <div class="success-sub">Мы свяжемся с вами в ближайшее время для подтверждения.</div>
        <div class="success-id" id="successId"></div>
        <button style="margin-top:24px;padding:12px 32px;font-size:15px" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script>
  let TOURS = [];
  let CURRENT = null;
  let SITE_TOAST_TM = null;

  // ===== Site toast =====
  function showSiteToast(msg) {
    const t = document.getElementById("siteToast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(SITE_TOAST_TM);
    SITE_TOAST_TM = setTimeout(() => t.classList.remove("show"), 3000);
  }

  // ===== CSS vars =====
  function setCSSVar(name, val){
    if (val === undefined || val === null || val === "") return;
    document.documentElement.style.setProperty(name, String(val));
  }

  async function loadTheme(){
    const theme = await fetch("/api/theme").then(r => r.json()).catch(() => ({}));
    if (theme.brand_name) document.getElementById("brandName").textContent = theme.brand_name;
    if (theme.subtitle)   document.getElementById("subtitle").textContent  = theme.subtitle;
    if (theme.hero_title) document.getElementById("heroTitle").textContent = theme.hero_title;
    if (theme.hero_desc)  document.getElementById("heroDesc").textContent  = theme.hero_desc;
    setCSSVar("--bg",      theme.bg);
    setCSSVar("--card",    theme.card);
    setCSSVar("--border",  theme.border);
    setCSSVar("--text",    theme.text);
    setCSSVar("--muted",   theme.muted);
    setCSSVar("--accent",  theme.accent);
    setCSSVar("--accent2", theme.accent2);
    if (Number.isFinite(Number(theme.radius)))       setCSSVar("--radius", theme.radius + "px");
    if (Number.isFinite(Number(theme.logo_size)))    setCSSVar("--logo",   theme.logo_size + "px");
    if (Number.isFinite(Number(theme.card_image_h))) setCSSVar("--imgH",   theme.card_image_h + "px");
    if (Number.isFinite(Number(theme.btn_h)))        setCSSVar("--btnH",   theme.btn_h + "px");
  }

  function safeText(s){ return (s || "").toString(); }

  function firstPhoto(t){
    if (Array.isArray(t.photos) && t.photos.length) return t.photos[0];
    if (t.image_url) return t.image_url;
    return "";
  }

  function priceChip(t){
    const p = Number(t.price_ils || 0);
    return p ? `₪${p}` : "₪—";
  }

  function durChip(t){
    const m = Number(t.duration_min || 0);
    if (!m) return "⏱ —";
    if (m >= 60) { const h = Math.round((m/60)*10)/10; return `⏱ ${h} ч`; }
    return `⏱ ${m} мин`;
  }

  function render(list){
    const el = document.getElementById("list");
    if (!list.length){
      el.innerHTML = `<div class="card"><div class="content" style="text-align:center;padding:30px"><div class="muted">Экскурсий пока нет.</div></div></div>`;
      return;
    }
    el.innerHTML = list.map(t => {
      const cover = firstPhoto(t);
      return `
        <div class="card">
          <div class="media">
            ${cover
              ? `<img src="${cover}" alt="" loading="lazy">`
              : `<div class="media-empty">Нет фото</div>`}
            <div class="badge">${priceChip(t)} • ${durChip(t)}</div>
          </div>
          <div class="content">
            <div class="tour-title">${safeText(t.title_ru) || "—"}</div>
            <div class="tour-desc">
              ${safeText(t.desc_ru).slice(0, 130)}${safeText(t.desc_ru).length > 130 ? "…" : ""}
            </div>
            <div class="actions">
              <button class="btn" onclick="openTour('${t.id}')">Подробнее</button>
              <button class="btn primary" onclick="openTour('${t.id}', true)">Записаться</button>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function setMainImage(url){
    document.getElementById("mainImg").src = url || "";
  }

  function renderThumbs(photos){
    const thumbs = document.getElementById("thumbs");
    if (!Array.isArray(photos) || !photos.length){
      thumbs.innerHTML = `<div class="muted" style="padding:8px;font-size:12px">Нет фото</div>`;
      return;
    }
    thumbs.innerHTML = photos.map((p, i) => `
      <div class="thumb ${i===0?'active':''}" onclick="pickPhoto(${i})">
        <img src="${p}" alt="" loading="lazy">
      </div>
    `).join("");
  }

  window.pickPhoto = idx => {
    const photos = (CURRENT && Array.isArray(CURRENT.photos)) ? CURRENT.photos : [];
    setMainImage(photos[idx] || firstPhoto(CURRENT));
    document.querySelectorAll(".thumb").forEach((t, i) => t.classList.toggle("active", i === idx));
  };

  function resetForm(){
    document.getElementById("name").value    = "";
    document.getElementById("phone").value   = "";
    document.getElementById("date").value    = "";
    document.getElementById("people").value  = "1";
    document.getElementById("comment").value = "";
    document.getElementById("result").textContent = "";
    document.getElementById("sendBtn").disabled    = false;
    document.getElementById("sendBtn").style.opacity = "1";
    // hide success, show form
    document.getElementById("bookingForm").style.display    = "block";
    document.getElementById("successScreen").classList.remove("visible");
  }

  window.openTour = (id, focusForm) => {
    const t = TOURS.find(x => x.id === id);
    if (!t) return;
    CURRENT = t;

    document.getElementById("mTitle").textContent = safeText(t.title_ru);
    document.getElementById("mDesc").textContent  = safeText(t.desc_ru);
    document.getElementById("mMeta").textContent  = `${priceChip(t)} • ${durChip(t)}`;

    const photos = Array.isArray(t.photos) && t.photos.length ? t.photos : (firstPhoto(t) ? [firstPhoto(t)] : []);
    CURRENT.photos = photos;
    setMainImage(photos[0] || "");
    renderThumbs(photos);

    resetForm();
    document.getElementById("overlay").style.display = "flex";
    document.getElementById("modal").scrollTop = 0;

    if (focusForm) setTimeout(() => document.getElementById("name").focus(), 60);
  };

  function closeModal(){
    document.getElementById("overlay").style.display = "none";
  }

  document.getElementById("closeBtn").onclick = closeModal;
  document.getElementById("overlay").addEventListener("click", e => {
    if (e.target.id === "overlay") closeModal();
  });

  document.getElementById("scrollBtn").onclick = () =>
    window.scrollTo({ top: document.querySelector(".wrap").offsetTop + 60, behavior: "smooth" });

  document.getElementById("search").addEventListener("input", () => {
    const q = document.getElementById("search").value.trim().toLowerCase();
    if (!q) return render(TOURS);
    render(TOURS.filter(t =>
      (safeText(t.title_ru) + " " + safeText(t.desc_ru)).toLowerCase().includes(q)
    ));
  });

  // ===== Send booking =====
  document.getElementById("sendBtn").onclick = async () => {
    if (!CURRENT) return;

    const name    = document.getElementById("name").value.trim();
    const phone   = document.getElementById("phone").value.trim();
    const dateVal = document.getElementById("date").value;

    // Immediate validation feedback
    if (!name)  { document.getElementById("result").textContent = "Введите имя"; return; }
    if (!phone) { document.getElementById("result").textContent = "Введите телефон / WhatsApp"; return; }
    if (!dateVal){ document.getElementById("result").textContent = "Укажите дату и время"; return; }

    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.style.opacity = "0.6";
    document.getElementById("result").textContent = "Отправляем заявку...";

    const payload = {
      tour_id:  CURRENT.id,
      name,
      phone,
      date_iso: new Date(dateVal).toISOString(),
      people:   document.getElementById("people").value || "1",
      comment:  document.getElementById("comment").value.trim()
    };

    const res  = await fetch("/api/bookings", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok){
      document.getElementById("result").textContent = "Ошибка: " + (data.error || "попробуйте ещё раз");
      btn.disabled = false;
      btn.style.opacity = "1";
      return;
    }

    // ===== SUCCESS: show success screen immediately =====
    document.getElementById("bookingForm").style.display = "none";
    const ss = document.getElementById("successScreen");
    ss.classList.add("visible");
    document.getElementById("successId").textContent = "Номер заявки: " + data.booking.id;

    // Also show toast
    showSiteToast("✅ Заявка отправлена! Мы скоро свяжемся с вами.");

    // Auto-close modal after 4 seconds
    setTimeout(() => { closeModal(); resetForm(); }, 4000);
  };

  async function load(){
    await loadTheme();
    TOURS = await fetch("/api/tours").then(r => r.json()).catch(() => []);
    render(TOURS);
  }
  load();
</script>
</body>
</html>
