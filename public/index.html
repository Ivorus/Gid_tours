<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Экскурсии</title>
  <style>
    body{font-family:system-ui,Arial;margin:0;background:#0c0c10;color:#e8e8f0}
    header{padding:16px 18px;border-bottom:1px solid #222230;display:flex;justify-content:space-between;align-items:center}
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{background:#14141c;border:1px solid #222230;border-radius:14px;padding:14px}
    .muted{color:#a6a8c0}
    button{background:#4f6ef7;border:0;color:white;padding:10px 12px;border-radius:10px;cursor:pointer}
    input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #222230;background:#0f0f16;color:#e8e8f0}
    label{display:block;margin:10px 0 6px}
    .rtl{direction:rtl;text-align:right}
    .pill{border:1px solid #222230;background:#0f0f16;border-radius:999px;padding:6px 10px;cursor:pointer}
    img{width:100%;border-radius:12px;border:1px solid #222230;display:block;margin-bottom:10px}
  </style>
</head>
<body>
<header>
  <div>
    <div style="font-weight:800">Guide Israel</div>
    <div class="muted" id="sub">Экскурсии и запись</div>
  </div>
  <div style="display:flex;gap:8px">
    <span class="pill" id="ru">RU</span>
    <span class="pill" id="he">HE</span>
  </div>
</header>

<div class="wrap">
  <div id="list" class="grid"></div>

  <div id="form" class="card" style="margin-top:14px;display:none">
    <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
      <div>
        <div id="tTitle" style="font-size:18px;font-weight:800"></div>
        <div id="tDesc" class="muted" style="margin-top:6px"></div>
      </div>
      <button id="close">✕</button>
    </div>

    <label id="lName">Имя</label>
    <input id="name"/>

    <label id="lPhone">Телефон</label>
    <input id="phone" placeholder="+972..."/>

    <label id="lDate">Дата</label>
    <input id="date" type="datetime-local"/>

    <label id="lPeople">Кол-во людей</label>
    <input id="people" type="number" min="1" value="1"/>

    <label id="lLang">Язык</label>
    <select id="lang">
      <option value="RU">RU</option>
      <option value="HE">HE</option>
    </select>

    <label id="lCom">Комментарий</label>
    <textarea id="comment" rows="3"></textarea>

    <button id="send" style="margin-top:12px;width:100%">Отправить заявку</button>
    <div id="res" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<script>
let LANG="RU";
let tours=[];

const tr = {
  RU:{sub:"Экскурсии и запись",name:"Имя",phone:"Телефон",date:"Дата",people:"Кол-во людей",lang:"Язык",com:"Комментарий",send:"Отправить заявку",ok:"Заявка отправлена. Ждите подтверждение.",book:"Записаться"},
  HE:{sub:"סיורים והרשמה",name:"שם",phone:"טלפון",date:"תאריך",people:"מספר אנשים",lang:"שפה",com:"הערה",send:"שליחת בקשה",ok:"הבקשה נשלחה. ממתין לאישור.",book:"להירשם"}
};

function apply(){
  document.getElementById("sub").textContent = tr[LANG].sub;
  document.getElementById("lName").textContent = tr[LANG].name;
  document.getElementById("lPhone").textContent = tr[LANG].phone;
  document.getElementById("lDate").textContent = tr[LANG].date;
  document.getElementById("lPeople").textContent = tr[LANG].people;
  document.getElementById("lLang").textContent = tr[LANG].lang;
  document.getElementById("lCom").textContent = tr[LANG].com;
  document.getElementById("send").textContent = tr[LANG].send;
  document.body.classList.toggle("rtl", LANG==="HE");
}

function render(){
  const el=document.getElementById("list");
  if(!tours.length){
    el.innerHTML = `<div class="card muted">Нет экскурсий. Добавь их в /admin</div>`;
    return;
  }
  el.innerHTML = tours.map(t=>`
    <div class="card">
      ${t.image_url ? `<img src="${t.image_url}" alt="">` : ``}
      <div style="font-weight:800">${LANG==="HE"?t.title_he:t.title_ru}</div>
      <div class="muted" style="margin-top:6px">${LANG==="HE"?t.desc_he:t.desc_ru}</div>
      <div class="muted" style="margin-top:10px">₪${t.price_ils} · ${Math.round((t.duration_min||0)/60)}ч</div>
      <button style="margin-top:12px" onclick="openForm('${t.id}')">${tr[LANG].book}</button>
    </div>
  `).join("");
}

async function load(){
  tours = await fetch("/api/tours").then(r=>r.json());
  render();
}

let currentTour=null;
window.openForm = (id)=>{
  currentTour = tours.find(x=>x.id===id);
  document.getElementById("tTitle").textContent = (LANG==="HE"?currentTour.title_he:currentTour.title_ru);
  document.getElementById("tDesc").textContent = (LANG==="HE"?currentTour.desc_he:currentTour.desc_ru);
  document.getElementById("res").textContent = "";
  document.getElementById("form").style.display="block";
};

document.getElementById("close").onclick=()=>document.getElementById("form").style.display="none";

document.getElementById("send").onclick = async ()=>{
  const payload = {
    tour_id: currentTour.id,
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    date_iso: new Date(document.getElementById("date").value).toISOString(),
    people: document.getElementById("people").value,
    lang: document.getElementById("lang").value,
    comment: document.getElementById("comment").value
  };
  const res = await fetch("/api/bookings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  const data = await res.json();
  if(!res.ok){ document.getElementById("res").textContent = "Ошибка: "+(data.error||""); return; }
  document.getElementById("res").textContent = tr[LANG].ok + " № " + data.booking.id;
};

document.getElementById("ru").onclick=()=>{LANG="RU";apply();render();};
document.getElementById("he").onclick=()=>{LANG="HE";apply();render();};

apply();
load();
</script>
</body>
</html>
