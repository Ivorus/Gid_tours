<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin</title>
  <style>
    body{font-family:system-ui,Arial;margin:0;background:#0c0c10;color:#e8e8f0}
    .wrap{max-width:680px;margin:0 auto;padding:22px}
    .card{background:#14141c;border:1px solid #222230;border-radius:14px;padding:16px;margin:14px 0}
    input{width:100%;padding:10px;border-radius:10px;border:1px solid #222230;background:#0f0f16;color:#e8e8f0}
    button{background:#4f6ef7;border:0;color:white;padding:10px 12px;border-radius:10px;cursor:pointer;width:100%}
    .muted{color:#a6a8c0}
    .err{color:#ff7b7b;margin-top:10px}
    .ok{color:#00e676;margin-top:10px}
    a{color:#a6a8c0}
  </style>
</head>
<body>
  <div class="wrap">
    <h2 style="margin:0 0 8px">Админ-панель</h2>
    <div class="muted">Вход для админа и сотрудников</div>

    <div class="card">
      <div class="muted" style="margin-bottom:8px">URL сервера: <span id="base"></span></div>

      <label>Email</label>
      <input id="email" placeholder="admin@guide.co.il"/>

      <label style="margin-top:10px">Пароль</label>
      <input id="password" type="password" placeholder="••••••••"/>

      <button id="loginBtn" type="button" style="margin-top:12px">Войти</button>

      <div id="msg" class="err"></div>
      <div class="muted" style="margin-top:10px">
        Проверка: <a href="/api/me" target="_blank">/api/me</a> · <a href="/health" target="_blank">/health</a>
      </div>
    </div>

    <div id="after" class="card" style="display:none">
      <div class="ok">✅ Вы вошли!</div>
      <div class="muted" id="me"></div>
      <button id="logoutBtn" type="button" style="margin-top:12px;background:#ff4757">Выйти</button>
    </div>
  </div>

<script>
  const base = location.origin;
  document.getElementById("base").textContent = base;

  async function api(url, method="GET", body){
    const res = await fetch(url, {
      method,
      headers: body ? {"content-type":"application/json"} : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(()=> ({}));
    return { ok: res.ok, data };
  }

  async function refresh(){
    const me = await api("/api/me");
    if(me.data && me.data.user){
      document.getElementById("after").style.display = "block";
      document.getElementById("me").textContent = me.data.user.email + " (" + me.data.user.role + ")";
    } else {
      document.getElementById("after").style.display = "none";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", async () => {
    document.getElementById("msg").textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const r = await api("/api/login","POST",{ email, password });
    if(!r.ok){
      document.getElementById("msg").textContent = r.data.error || "Ошибка входа";
      return;
    }
    await refresh();
    document.getElementById("msg").textContent = "";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await api("/api/logout","POST");
    await refresh();
  });

  refresh();
</script>
</body>
</html>
