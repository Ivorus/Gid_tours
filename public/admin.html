<script>
const qs = (id)=>document.getElementById(id);

async function api(url, method="GET", body){
  const res = await fetch(url, {
    method,
    headers: body ? {"content-type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(()=> ({}));
  return { ok: res.ok, data };
}

async function refresh(){
  const me = await api("/api/me");
  if(!me.data.user){
    qs("loginBox").style.display="block";
    qs("app").style.display="none";
    return;
  }
  qs("loginBox").style.display="none";
  qs("app").style.display="block";
  qs("me").textContent = `${me.data.user.email} (${me.data.user.role})`;
  qs("staffBox").style.display = (me.data.user.role==="admin") ? "block" : "none";

  const tours = await api("/api/admin/tours");
  qs("tours").innerHTML = (tours.data || []).map(t=>`
    <div style="padding:10px;border:1px solid #222230;border-radius:12px;margin:8px 0">
      <b>${t.title_ru}</b> / ${t.title_he}
      <div class="muted">₪${t.price_ils} · ${t.duration_min} мин · active: ${t.is_active}</div>
      <div class="muted">id: ${t.id}</div>
      <button onclick="delTour('${t.id}')" style="margin-top:8px;background:#ff4757">Удалить</button>
    </div>
  `).join("") || "пусто";

  const bookings = await api("/api/admin/bookings");
  qs("bookings").innerHTML = (bookings.data || []).map(b=>`
    <div style="padding:10px;border:1px solid #222230;border-radius:12px;margin:8px 0">
      <b>${b.name}</b> · ${b.phone} · 👥 ${b.people} · ${b.lang}
      <div class="muted">${new Date(b.created_at).toLocaleString()} · дата: ${b.date_iso}</div>
      <div class="muted">Экскурсия: ${b.tour ? b.tour.title_ru : b.tour_id}</div>
      <div class="muted">Статус: <span class="pill">${b.status}</span></div>
      <div style="margin-top:8px">
        <button onclick="setStatus('${b.id}','confirmed')">Подтвердить</button>
        <button onclick="setStatus('${b.id}','declined')" style="background:#ff9500">Отклонить</button>
        <button onclick="setStatus('${b.id}','paid')" style="background:#00e676;color:#0c0c10">Оплачено</button>
      </div>
    </div>
  `).join("") || "пока заявок нет";
}

async function setStatus(id, status){
  await api("/api/admin/bookings/"+id+"/status","PUT",{status});
  refresh();
}
async function delTour(id){
  await api("/api/admin/tours/"+id,"DELETE");
  refresh();
}
window.setStatus = setStatus;
window.delTour = delTour;

window.addEventListener("DOMContentLoaded", () => {
  qs("login").addEventListener("click", async () => {
    qs("err").textContent="";
    const r = await api("/api/login","POST",{
      email: qs("email").value,
      password: qs("password").value
    });
    if(!r.ok){ qs("err").textContent = r.data.error || "Ошибка"; return; }
    refresh();
  });

  qs("logout").addEventListener("click", async () => {
    await api("/api/logout","POST");
    refresh();
  });

  qs("addTour").addEventListener("click", async () => {
    qs("tourRes").textContent="";
    const body = {
      title_ru: qs("tr").value, title_he: qs("th").value,
      desc_ru: qs("dr").value, desc_he: qs("dh").value,
      price_ils: Number(qs("price").value||0),
      duration_min: Number(qs("dur").value||0),
      image_url: qs("img").value,
      is_active: qs("active").checked
    };
    const r = await api("/api/admin/tours","POST",body);
    qs("tourRes").textContent = r.ok ? "Сохранено" : ("Ошибка: "+(r.data.error||""));
    if(r.ok){ qs("tr").value=""; qs("th").value=""; qs("dr").value=""; qs("dh").value=""; qs("img").value=""; }
    refresh();
  });

  qs("createStaff")?.addEventListener("click", async () => {
    qs("staffRes").textContent="";
    const r = await api("/api/admin/users","POST",{
      email: qs("sEmail").value,
      password: qs("sPass").value,
      role: qs("sRole").value
    });
    qs("staffRes").textContent = r.ok ? "Сотрудник создан" : ("Ошибка: "+(r.data.error||""));
    if(r.ok){ qs("sEmail").value=""; qs("sPass").value=""; }
  });

  refresh();
});
</script>
