<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Админ — заявки</title>
  <style>
    body{font-family:system-ui,Arial;margin:0;background:#0c0c10;color:#e8e8f0}
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .card{background:#14141c;border:1px solid #222230;border-radius:14px;padding:14px;margin-bottom:12px}
    input{width:100%;padding:10px;border-radius:10px;border:1px solid #222230;background:#0f0f16;color:#e8e8f0}
    button{background:#4f6ef7;border:0;color:white;padding:9px 10px;border-radius:10px;cursor:pointer;margin-right:8px}
    .muted{color:#a6a8c0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .status{padding:4px 8px;border:1px solid #222230;border-radius:999px;background:#0f0f16}
    .error{color:#ff7b7b;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <h2 style="margin:0 0 10px">Админка: заявки</h2>
  <div class="muted">Введи ADMIN_TOKEN (на сервере) и нажми “Загрузить”.</div>
  <div class="error" id="err"></div>

  <div style="margin-top:10px">
    <input id="token" placeholder="ADMIN_TOKEN"/>
    <button id="load" style="margin-top:10px">Загрузить заявки</button>
  </div>

  <div id="list" style="margin-top:14px"></div>
</div>

<script>
  function detectBase() {
    const p = location.pathname;
    const m = p.match(/^\/([^\/]+)\/public\/admin\.html/);
    return m ? "/" + m[1] : "";
  }
  const BASE = detectBase();
  const API = (path) => BASE + path;

  async function fetchBookings() {
    document.getElementById("err").textContent = "";
    const token = document.getElementById("token").value.trim();
    const res = await fetch(API("/api/admin/bookings?token=" + encodeURIComponent(token)));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Unauthorized");

    const el = document.getElementById("list");
    el.innerHTML = data.map(b => `
      <div class="card">
        <div class="row">
          <div style="font-weight:800">${b.name}</div>
          <div class="status">${b.status}</div>
          <div class="muted">${new Date(b.created_at).toLocaleString()}</div>
        </div>
        <div style="margin-top:8px" class="muted">
          ${b.tour ? (b.tour.title_ru + " / " + b.tour.title_he) : ""}
        </div>
        <div style="margin-top:6px">📞 ${b.phone} · 👥 ${b.adults} + ${b.kids}</div>
        <div class="muted" style="margin-top:6px">${b.comment || ""}</div>
        <div style="margin-top:10px">
          <button onclick="setStatus('${b.id}','confirmed')">Подтвердить</button>
          <button onclick="setStatus('${b.id}','declined')">Отклонить</button>
          <button onclick="setStatus('${b.id}','paid')">Оплачено</button>
        </div>
      </div>
    `).join("");
  }

  async function setStatus(id, status) {
    const token = document.getElementById("token").value.trim();
    const res = await fetch(API("/api/admin/bookings/" + id + "/status?token=" + encodeURIComponent(token)), {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({ status })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || "error"); return; }
    fetchBookings();
  }

  window.setStatus = setStatus;

  document.getElementById("load").onclick = () => {
    fetchBookings().catch(e => {
      document.getElementById("err").textContent =
        "Ошибка: " + e.message + ". Проверь backend: " + API("/api/health");
    });
  };
</script>
</body>
</html>
